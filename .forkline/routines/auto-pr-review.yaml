name: auto-pr-review
description: Maintainability review of pull requests opened by the Forkline bot, committing small certain fixes; native replacement of the auto PR review built-in
on:
  events: [pr.opened]
repositories:
  include:
    - name: "forkline/ingress-nginx"
filters:
  draft: exclude
  fork: exclude
  bots: include
  self: include
  authors:
    include: ["forkline[bot]"]
  labels:
    exclude: [no-auto-review]
agent:
  model: isidoro/balanced
  runnerSize: advanced
  timeoutMinutes: 30
  prompt: |
    Review pull request #{{ pr.number }} "{{ pr.title }}" ({{ pr.headBranch }} into {{ pr.baseBranch }}) in {{ repository.fullName }}, opened by {{ pr.author }}. Load the `maintenance` skill (.opencode/skills/maintenance/SKILL.md) first, then read the diff (`git diff origin/{{ pr.baseBranch }}...HEAD`).

    Maintainability review, in this order: scope (maintenance lanes only); behavior (any change, a bump hiding a changed default or removed API); consistency (NGINX_BASE, images/nginx/TAG and NGINX_VERSION agree; GOLANG_VERSION and go.mod agree; generated files not hand-edited); tests (coverage not lower, no test deleted or weakened, a fix has a regression test); hygiene (commit types and scopes, descriptive title, no `.orig`/`.rej`, no trailing whitespace); duplicates (`git-api pr list`: say which pull request to keep; do not close either).

    Action: COMMIT fixes to `{{ pr.headBranch }}` for what is small and certain (formatting, a missing regeneration, a stale TAG file, a missing test for the exact changed line). One commit per concern, conventional messages, fast-forward push, `git pull --rebase` first if it moved. A wrong PR title or commit scope is described, not fixed. A `release: prepare` pull request is generated by `.ci/release.sh`: review it (see the `release-readiness` skill) but commit nothing to it. Never commit what you are unsure of.

    Finish with ONE plain comment (`git-api comment create --issue {{ pr.number }}`, never a review: open review threads block merging on main) whose first line is `<!-- forkline-auto-review -->`: what you checked, what you committed (commit ids), what remains for a human. If that marker already exists you reviewed it before: comment again only when something new is wrong. Never merge, close or approve (the `merge-gate` routine decides merging).
concurrency:
  group: pr
  onConflict: skip
  maxActive: 3
limits:
  maxRunsPerPr: 2
