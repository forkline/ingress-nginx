name: merge-gate
description: Independent low-risk review of green pull requests authored by the Forkline bot; merges them or escalates. Criteria live in the merge-gate skill, which starts in observe mode
on:
  events: [ci.succeeded]
repositories:
  include:
    - name: "forkline/ingress-nginx"
filters:
  when: pr.number != null
agent:
  model: openai/gpt-5.5
  runnerSize: advanced
  timeoutMinutes: 30
  prompt: |
    CI is green on pull request #{{ pr.number }} ({{ pr.url }}), head {{ pr.headSha }}, branch `{{ pr.headBranch }}` into `{{ pr.baseBranch }}` of {{ repository.fullName }}. The event carries no title, author or labels: read them from the forge (`git-api pr view {{ pr.number }}`).

    You are the independent reviewer: a different model from the routines that write fixes. Load the `maintenance`, `merge-gate` and `release-readiness` skills (.opencode/skills/) and follow the merge-gate procedure exactly, including its Mode line: in `observe` mode you never merge and never label. Stop silently when the pull request is not authored by `forkline[bot]`, is a draft or a fork, or does not target main: Renovate and human pull requests are not yours. Judge the diff yourself, not the author's description. In your final message state the decision (merged, would merge, escalated, ignored) and the evidence.
concurrency:
  group: repository
  onConflict: skip
  maxActive: 3
limits:
  maxRunsPerPr: 3
  resetOn: ci.succeeded
