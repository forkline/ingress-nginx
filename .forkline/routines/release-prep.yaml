name: release-prep
description: When a security fix or an NGINX bump merges to main, run the release readiness checklist and, only if it passes, open the release pull request
on:
  events: [pr.merged]
repositories:
  include:
    - name: "forkline/ingress-nginx"
filters:
  branches:
    include: [main]
  bots: include
  self: include
  when: >-
    !pr.title.startsWith("release") && (
    pr.labels.exists(l, l == "security") ||
    pr.title.matches("(?i)(CVE-[0-9]|GHSA-|GO-20[0-9]|govulncheck|\\[security\\]|\\(security\\)|security fix|vulnerab)") ||
    pr.title.matches("(?i)(nginx/nginx|nginx source|(update|upgrade|bump) nginx|nginx.*(update|upgrade|bump))"))
agent:
  model: isidoro/advanced
  runnerSize: advanced
  timeoutMinutes: 60
  prompt: |
    Pull request #{{ pr.number }} "{{ pr.title }}" ({{ pr.url }}) by {{ pr.author }} was merged into {{ pr.baseBranch }} of {{ repository.fullName }}. Labels: {{ pr.labels | join(", ") }}. A security fix or an NGINX bump should reach users fast, but only when we are almost sure.

    Load the `maintenance`, `release` and `release-readiness` skills (.opencode/skills/) and follow them; do not improvise release steps.

    0. Is a release warranted? The title filter is only a guess. `git show --stat` of the merge commit must show a security fix (CVE, GO- or GHSA- id, govulncheck, a vulnerable dependency bumped, a Trivy finding) or an NGINX version bump or patch change. Otherwise stop and post nothing. Also stop if no fix or bump landed since the last tag.
    1. No duplicate: `git-api pr list`, look for an open pull request titled `release: prepare ...`. None: continue. One open, bot-created and without human commits: it is stale, regenerate it on its branch (step 3) and say so in a comment. One open touched by a human: leave it, comment that #{{ pr.number }} merged after it was prepared and it must be regenerated before merging.
    2. Run the readiness checklist of the `release-readiness` skill, item by item, with evidence. If an item fails (main CI not green, changelog incomplete, version files inconsistent, a blocking `needs-maintainer` or `security` item), do NOT open the release pull request: escalate per the `maintenance` protocol on #{{ pr.number }} naming the failed item and what unblocks it.
    3. Prepare: `release/prep` from a fresh origin/main, `.ci/release.sh` (install git-cliff and helm-docs if missing), rename the branch to `release/$(cat TAG)`, re-check `git show --stat HEAD` touches only release files, `pre-commit run --files $(git diff --name-only HEAD~1)`.
    4. Push and open `release: prepare <version>` with `git-api pr create --base main`. Body: why now (link #{{ pr.number }}, CVE ids or the NGINX version), the checklist with its evidence, the changelog highlights, and "merging this tags and publishes the release automatically (auto-tag.yml)". Do not enable auto-merge, merge or tag: the `merge-gate` routine or a human merges it.
    5. Before finishing `git fetch`: if another qualifying pull request merged while you worked, redo step 3 on the same branch so the release includes it. Final message: one line, what you opened or why you stopped.
concurrency:
  group: repository
  onConflict: skip
  maxActive: 1
limits:
  maxRunsPerPr: 2
