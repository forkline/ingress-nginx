name: renovate-unblock
description: Daily, find Renovate pull requests stuck for more than 48 hours (failing, edited or blocked) and unblock them on a separate branch or post a diagnosis
on:
  schedule:
    cron: "30 6 * * *"
    timezone: UTC
repositories:
  include:
    - name: "forkline/ingress-nginx"
agent:
  model: isidoro/advanced
  runnerSize: advanced
  timeoutMinutes: 90
  prompt: |
    Daily Renovate unblock pass for {{ repository.fullName }}. Load the `maintenance` skill (.opencode/skills/maintenance/SKILL.md) first, and read renovate.json. Renovate automerges minor and patch updates; you find the pull requests it cannot finish and unblock them WITHOUT making things worse: never push to a Renovate branch (renovate/*, pre-commit-*), never merge or close a Renovate pull request, never edit its description.

    1. Candidates: `git-api pr list` for open pull requests by renovate, open more than 48 hours, with failing checks (`git-api checks list <branch>`), or with commits not by renovate[bot], or whose renovate comment says "Edited/Blocked" or "Branch has conflicts". Skip younger ones, green ones waiting for automerge and the Dependency Dashboard issue.
    2. Dedupe per Renovate pull request N: the fix branch prefix `fix/renovate-N-`. Check `git-api pr list --state all`, `git ls-remote --heads origin 'fix/renovate-N-*'`, and the marker `<!-- forkline-renovate-unblock:N:<head sha> -->` in the comments. A fix pull request or a marker for this head means do nothing for N. The ci-auto-fix routine uses the same keys.
    3. Diagnose (`git-api logs fetch <run id>`) and take exactly one outcome:
       a. Only stale or behind main: label `rebase` (`git-api label add --issue N --labels rebase`). No comment.
       b. Flaky or infrastructure failure: `git-api run rerun <run id>` once. No comment unless it fails again.
       c. The update is wrong (retracted or +incompatible version such as k8s.io/client-go v11.0.0+incompatible, unsupported major such as go.yaml.in/yaml v4, missing package): ONE diagnosis comment with the marker, naming package and version, proposing a `packageRules` entry; open that entry as a PR from `fix/renovate-N-config` (`chore(deps): ignore <package> major in Renovate`, validate with `pre-commit run renovate-config-validator --files renovate.json`) unless it is already ignored. A major-version ignore rule is a policy change: escalate per the protocol rather than deciding it.
       d. The update is right and the code or generated files need a change: `fix/renovate-N-<slug>` from origin/main, PR to main `fix(<scope>): <subject>`. Only the compatibility change if it also works with the old version; include the bump when it cannot (NGINX patch rework: lessons in the `maintenance` skill) and say in the body and in a comment on the Renovate PR that it supersedes it. NGINX bumps are high risk: escalate after opening the PR.
       e. "Edited/Blocked" by earlier foreign commits: ONE comment (marker): Renovate will not rebase, which commits are foreign (`git log origin/main..origin/<branch> --format='%h %an %s'`), and that the rebase box or the `rebase` label discards them. Do not do it yourself.
       f. You cannot tell: escalate per the protocol.
    Verify any change with the smallest build and test (`go build ./...`, `go test` for touched packages, `pre-commit run --files <files>`).
    4. Post nothing about the pass itself. In the final message list per pull request which outcome you took.
concurrency:
  group: repository
  onConflict: skip
  maxActive: 1
