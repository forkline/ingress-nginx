name: ci-auto-fix
description: Fix failing CI on forkline/ingress-nginx without breaking Renovate; bound to the CI auto-fix decision point
on:
  events: [ci.failed]
repositories:
  include:
    - name: "forkline/ingress-nginx"
agent:
  model: isidoro/advanced
  runnerSize: advanced
  timeoutMinutes: 60
  prompt: |
    CI failed on {{ repository.fullName }}, branch `{{ managed.ref }}`{% if managed.prNumber %}, pull request #{{ managed.prNumber }}{% endif %}, commit {{ managed.headSha }}. The failed runs and their logs follow in the platform-prepared material below.

    First load the `maintenance` skill (.opencode/skills/maintenance/SKILL.md) and follow it: scope policy, hard rules, tool limits, escalation protocol. The platform posts no status comments for this routine, so you post your own (step 6).

    1. Classify the failure from the logs. Flaky or infrastructure failures (kind timeout, registry or rate-limit error, Helm chart-testing flake): rerun the failed jobs once with `git-api run rerun <run id>` before changing anything. The same job failing twice on this commit is real.
    2. Fixable in place: pre-commit (`pre-commit run --files <files>`), generated files (`helm-docs --chart-search-root charts`, `bash hack/generate-deploy-scripts.sh`), golangci-lint (`make golint-check`), unit tests of the touched package, Lua lint, chart lint.
    3. A govulncheck or Security failure that also fails on main belongs to the `govulncheck-main` routine: link it in a comment and stop.
    4. NGINX changes (NGINX_BASE, images/nginx/, NGINX_VERSION): follow the NGINX lessons in the `maintenance` skill (per-version patches, reference commits, NGINX_BASE equals the build.sh version).
    {% if managed.ref is startingwith("renovate/") or managed.ref is startingwith("pre-commit-") %}
    5. THIS IS A RENOVATE BRANCH: never push to `{{ managed.ref }}` (forkline/ingress-nginx#642). Decide:
       a. The update itself is wrong (retracted or +incompatible version such as k8s.io/client-go v11.0.0+incompatible, an unsupported major such as go.yaml.in/yaml v4, a missing package): do not fix code. Diagnose in the comment and propose a renovate.json `packageRules` entry; open that change as a PR from `fix/renovate-{{ managed.prNumber }}-config` only if none exists.
       b. The update is right and the code needs a compatible change: branch `fix/renovate-{{ managed.prNumber }}-<slug>` from origin/main, PR to main. Only the compatibility change if it also works with the old version (Renovate then rebases green); include the bump when it cannot (NGINX patches) and comment "superseded by #<n>" on the Renovate PR. One fix branch per Renovate PR: search `git-api pr list` and `git ls-remote --heads origin 'fix/renovate-{{ managed.prNumber }}-*'` first and comment on an existing one instead of opening another.
    {% else %}
    5. This branch is not owned by Renovate: push the fix to `{{ managed.ref }}` (fast-forward, `git pull --rebase` first if it moved). After pushing, wait once with `git-api checks wait {{ managed.ref }} --timeout 1500`. Do not thrash: stop when the platform's attempts end.
    {% endif %}
    6. Post ONE status comment per attempt (first line `<!-- forkline-ci-status:{{ managed.headSha }} -->`; none if that marker exists for this head). On success: what was wrong, commit ids or PR link. When you cannot fix it: failing job, root cause as far as known, what you tried, options, and what a human must decide; then escalate per the protocol (label `needs-maintainer`, assign, no second escalation) if this was the last attempt or the problem needs a decision.
managed:
  source: ci-auto-fix
  ciAutoFix:
    maxAttempts: 3
concurrency:
  group: pr
  onConflict: skip
  maxActive: 3
