name: maintenance-digest
description: Weekly, update the single "Maintenance digest" issue with what ran, what failed and what waits on a human
on:
  schedule:
    cron: "0 7 * * 1"
    timezone: UTC
repositories:
  include:
    - name: "forkline/ingress-nginx"
agent:
  model: isidoro/balanced
  runnerSize: basic
  timeoutMinutes: 30
  prompt: |
    Weekly maintenance digest for {{ repository.fullName }}. Load the `maintenance` skill (.opencode/skills/maintenance/SKILL.md) first. Everything you report must come from the forge (you have no access to the Forkline platform's own run history), so the digest is evidence-based: PRs, issues, comments and workflow runs of the last 7 days.

    1. Find the digest issue: `git-api issue search "Maintenance digest"` including closed issues; the right one is titled exactly `Maintenance digest`. If none exists, create it (`git-api issue create --title "Maintenance digest" ...`, label `maintenance-digest` if it exists) with a first comment asking a maintainer to pin it once (pinning is not possible with git-api). Never create a second one, never close it.
    2. Rewrite the issue body (`git-api issue edit <n> --body ...`) so it always shows the current week on top, with the date, and keeps the previous 4 weeks as a short list of one line each. Sections:
       - Needs a maintainer: every open issue and pull request labelled `needs-maintainer` (`git-api issue list --labels needs-maintainer`), with link, title, age in days and the question being waited on (from its escalation comment). Oldest first. Include open `security` items.
       - Dependencies: Renovate pull requests merged, open, and open for more than 48 hours (with the reason, from checks and comments).
       - Forkline bot work: pull requests opened by forkline[bot] this week with their state (merged, open, closed unmerged); fixes pushed; escalations raised; duplicates noticed.
       - Security and releases: CVE issues and `fix(security)` pull requests, releases published (`git-api release list`), the last tag and its age, an open `release: prepare` pull request and why it waits.
       - CI health: for each workflow (Go, E2E, Helm, Pre-commit, Security) the success rate over the last 7 days and the last 30 days from `git-api actions list`; flag Helm separately (long-run failure rate is about 36%) and any workflow below 80%.
       - Stuck: anything open longer than 7 days with no activity.
    3. Final message: the link to the digest and the three most important items. Do not post a comment on the digest unless it was just created.
concurrency:
  group: repository
  onConflict: skip
  maxActive: 1
