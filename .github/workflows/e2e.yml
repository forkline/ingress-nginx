---
name: E2E

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      focus:
        description: Optional ginkgo focus pattern
        required: false
        type: string

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect E2E changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'rootfs/**'
              - 'images/nginx/**'
              - 'test/e2e/**'
              - 'test/e2e-image/**'
              - 'charts/**'
              - 'NGINX_BASE'
              - '.github/workflows/e2e.yml'

  build:
    name: Build test images
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Go version
        run: echo "GOLANG_VERSION=$(cat GOLANG_VERSION)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare kubectl
        run: |
          curl -LO https://dl.k8s.io/release/v1.35.3/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install ginkgo
        run: go install -mod=mod github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build nginx base image
        working-directory: images/nginx
        run: |
          TAGNGINX=$(cat TAG)
          NGINX_VERSION=$(grep 'export NGINX_VERSION=' rootfs/build.sh | sed 's/.*NGINX_VERSION=//')
          NGINX_IMAGE="ghcr.io/forkline/ingress-nginx/nginx:${NGINX_VERSION}"
          if docker pull ${NGINX_IMAGE}; then
            docker tag ${NGINX_IMAGE} ingress-nginx/nginx:${TAGNGINX}
            echo "Reused nginx base image (NGINX ${NGINX_VERSION}) from registry"
          else
            echo "NGINX ${NGINX_VERSION} not in registry, building..."
            docker buildx create --name ingress-nginx --bootstrap || :
            docker buildx build \
              --builder ingress-nginx \
              --platform linux/amd64,linux/arm64 \
              rootfs \
              --tag ${NGINX_IMAGE} \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --push
            echo "Built and pushed nginx base image for NGINX ${NGINX_VERSION}"
          fi
          docker pull --platform linux/amd64 ${NGINX_IMAGE}
          docker tag ${NGINX_IMAGE} ingress-nginx/nginx:${TAGNGINX}

      - name: Pull or build kube-webhook-certgen image
        working-directory: images
        run: |
          CERTGEN_TAG=$(cat kube-webhook-certgen/TAG)
          if docker pull \
              ghcr.io/forkline/ingress-nginx/kube-webhook-certgen:latest; then
            docker tag \
              ghcr.io/forkline/ingress-nginx/kube-webhook-certgen:latest \
              ghcr.io/forkline/ingress-nginx/kube-webhook-certgen:${CERTGEN_TAG}
            echo "Reused kube-webhook-certgen from registry"
          else
            echo "Image not in registry, building locally..."
            GOLANG_VERSION=$(cat ../GOLANG_VERSION)
            docker buildx build \
              --platform linux/amd64 \
              --build-arg GOLANG_VERSION=${GOLANG_VERSION} \
              kube-webhook-certgen/rootfs \
              --tag kube-webhook-certgen:${CERTGEN_TAG} \
              --load
            docker tag kube-webhook-certgen:${CERTGEN_TAG} \
              ghcr.io/forkline/ingress-nginx/kube-webhook-certgen:${CERTGEN_TAG}
          fi

      - name: Build controller and e2e images
        env:
          TAG: 1.0.0-dev
          ARCH: amd64
          REGISTRY: ingress-controller
        run: |
          NGINX_VERSION=$(grep 'export NGINX_VERSION=' images/nginx/rootfs/build.sh | sed 's/.*NGINX_VERSION=//')
          NGINX_BASE_IMAGE=ghcr.io/forkline/ingress-nginx/nginx:${NGINX_VERSION}
          PKG=k8s.io/ingress-nginx
          COMMIT_SHA=$(git rev-parse HEAD)
          REPO_INFO=$(git remote get-url origin)
          LDFLAGS="-buildid= -w -s"
          LDFLAGS="${LDFLAGS} -X ${PKG}/version.RELEASE=${TAG}"
          LDFLAGS="${LDFLAGS} -X ${PKG}/version.COMMIT=${COMMIT_SHA}"
          LDFLAGS="${LDFLAGS} -X ${PKG}/version.REPO=${REPO_INFO}"
          for bin in nginx-ingress-controller:cmd/nginx \
            dbg:cmd/dbg \
            wait-shutdown:cmd/waitshutdown; do
            name=${bin%:*}
            path=${bin#*:}
            mkdir -p rootfs/bin/${ARCH}
            CGO_ENABLED=0 go build -trimpath \
              -ldflags="${LDFLAGS}" -buildvcs=false \
              -o rootfs/bin/${ARCH}/${name} ${PKG}/${path}
          done
          docker build --no-cache \
            --build-arg BASE_IMAGE=${NGINX_BASE_IMAGE} \
            --build-arg VERSION=${TAG} \
            --build-arg TARGETARCH=${ARCH} \
            --build-arg COMMIT_SHA=${COMMIT_SHA} \
            -t ${REGISTRY}/controller:${TAG} rootfs
          docker build --no-cache \
            --build-arg BASE_IMAGE=${NGINX_BASE_IMAGE} \
            --build-arg VERSION=${TAG} \
            --build-arg TARGETARCH=${ARCH} \
            --build-arg COMMIT_SHA=${COMMIT_SHA} \
            -t ${REGISTRY}/controller-chroot:${TAG} rootfs \
            -f rootfs/Dockerfile-chroot
          CGO_ENABLED=0 GOFLAGS=-vet=off ginkgo build ./test/e2e
          cp test/e2e/e2e.test test/e2e-image/
          cp test/e2e/wait-for-nginx.sh test/e2e-image/
          cp -R charts test/e2e-image/ 2>/dev/null || true
          cp -R test/e2e/settings/ocsp/* test/e2e-image/ 2>/dev/null || true
          E2E_BASE_IMAGE="registry.k8s.io/ingress-nginx/e2e-test-runner:v2.2.9@sha256:6eda6a8d17ff65c5af647abb0714b882047b77d18161712d77daf5f610fd4020"
          docker build \
            --build-arg E2E_BASE_IMAGE=${E2E_BASE_IMAGE} \
            --tag nginx-ingress-controller:e2e \
            test/e2e-image
          CERTGEN_TAG=$(cat images/kube-webhook-certgen/TAG)
          docker save \
            nginx-ingress-controller:e2e \
            ingress-controller/controller:1.0.0-dev \
            ingress-controller/controller-chroot:1.0.0-dev \
            ${NGINX_BASE_IMAGE} \
            ghcr.io/forkline/ingress-nginx/kube-webhook-certgen:${CERTGEN_TAG} \
            | gzip > docker.tar.gz

      - name: Upload image cache
        uses: actions/upload-artifact@v7
        with:
          name: docker.tar.gz
          path: docker.tar.gz
          retention-days: 1

  chart-test:
    name: Chart e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.e2e == 'true') && needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image cache
        uses: actions/download-artifact@v8
        with:
          name: docker.tar.gz

      - name: Load image cache
        run: gzip --decompress --stdout docker.tar.gz | docker load

      - name: Run chart tests
        env:
          K8S_VERSION: v1.35.1
          SKIP_IMAGE_CREATION: true
        run: |
          sudo mkdir -pm 777 "${HOME}/.kube"
          make kind-e2e-chart-tests

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, build]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.e2e == 'true') && needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image cache
        uses: actions/download-artifact@v8
        with:
          name: docker.tar.gz

      - name: Load image cache
        run: gzip --decompress --stdout docker.tar.gz | docker load

      - name: Install kind
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          install_only: true

      - name: Run e2e tests
        env:
          K8S_VERSION: v1.35.1
          SKIP_CLUSTER_CREATION: false
          SKIP_INGRESS_IMAGE_CREATION: true
          SKIP_E2E_IMAGE_CREATION: true
          FOCUS: ${{ inputs.focus }}
        run: make kind-e2e-test

      - name: Upload junit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports-kubernetes
          path: test/junitreports/*.xml

      - name: Generate E2E test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          GS="$GITHUB_STEP_SUMMARY"
          if [ -d "test/junitreports" ] && \
            ls test/junitreports/*.xml 1>/dev/null 2>&1; then
            REPORT_COUNT=$(ls test/junitreports/*.xml 2>/dev/null | wc -l)
            echo "Found ${REPORT_COUNT} test report(s)" >> "$GS"
            for report in test/junitreports/*.xml; do
              echo "### $(basename ${report})" >> "$GS"
              TESTS=$(grep -c '<testcase' "${report}" 2>/dev/null \
                || echo "0")
              FAILURES=$(grep -c '<failure' "${report}" 2>/dev/null \
                || echo "0")
              echo "- Tests: ${TESTS}, Failures: ${FAILURES}" >> "$GS"
            done
          else
            echo "No junit reports found" >> "$GS"
          fi

  kubernetes-chroot:
    name: Kubernetes chroot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, build]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.changes.outputs.e2e == 'true' ||
      needs.changes.result == 'skipped') &&
      needs.build.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image cache
        uses: actions/download-artifact@v8
        with:
          name: docker.tar.gz

      - name: Load image cache
        run: gzip --decompress --stdout docker.tar.gz | docker load

      - name: Install kind
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
          install_only: true

      - name: Run chroot e2e tests
        env:
          K8S_VERSION: v1.35.1
          IS_CHROOT: true
          SKIP_CLUSTER_CREATION: false
          SKIP_INGRESS_IMAGE_CREATION: true
          SKIP_E2E_IMAGE_CREATION: true
        run: make kind-e2e-test

      - name: Upload junit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports-kubernetes-chroot
          path: test/junitreports/*.xml

      - name: Generate E2E test summary
        if: always()
        run: |
          echo "## E2E Chroot Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          GS="$GITHUB_STEP_SUMMARY"
          if [ -d "test/junitreports" ] && \
            ls test/junitreports/*.xml 1>/dev/null 2>&1; then
            REPORT_COUNT=$(ls test/junitreports/*.xml 2>/dev/null | wc -l)
            echo "Found ${REPORT_COUNT} test report(s)" >> "$GS"
            for report in test/junitreports/*.xml; do
              echo "### $(basename ${report})" >> "$GS"
              TESTS=$(grep -c '<testcase' "${report}" 2>/dev/null \
                || echo "0")
              FAILURES=$(grep -c '<failure' "${report}" 2>/dev/null \
                || echo "0")
              echo "- Tests: ${TESTS}, Failures: ${FAILURES}" >> "$GS"
            done
          else
            echo "No junit reports found" >> "$GS"
          fi

  rerun-failed-jobs:
    runs-on: ubuntu-latest
    needs:
      - kubernetes
      - chart-test
    if: failure() && github.run_attempt == 1
    steps:
      - name: Rerun failed jobs in this workflow
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yaml -F run_id=${{ github.run_id }}

  e2e-checks-passed:
    name: E2E checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build, chart-test, kubernetes]
    if: >-
      always()
      && github.event_name == 'pull_request'
    steps:
      - name: Check E2E results
        run: |
          GS="$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.changes.outputs.e2e }}" == "true" ]]; then
            echo "## E2E Changes Detected" >> "$GS"
            echo "" >> "$GS"
            BUILD="${{ needs.build.result }}"
            CHART="${{ needs.chart-test.result }}"
            K8S="${{ needs.kubernetes.result }}"
            echo "- Build test images: ${BUILD}" >> "$GS"
            echo "- Chart e2e: ${CHART}" >> "$GS"
            echo "- Kubernetes: ${K8S}" >> "$GS"
            echo "" >> "$GS"
            if [[ "${BUILD}" == "success" ]] \
              && [[ "${CHART}" == "success" ]] \
              && [[ "${K8S}" == "success" ]]; then
              echo ":white_check_mark: **Status: PASSED**" >> "$GS"
            else
              echo ":x: **Status: FAILED**" >> "$GS"
              exit 1
            fi
          else
            echo "## E2E Checks Appropriately Skipped" >> "$GS"
            echo "" >> "$GS"
            echo "No E2E-related files changed in PR." >> "$GS"
            echo "" >> "$GS"
            echo ":white_check_mark: **Status: PASSED (Skipped)**" >> "$GS"
          fi
